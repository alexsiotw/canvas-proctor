<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ProctorGuard Teacher Dashboard">
  <title>ProctorGuard</title>
  <link rel="stylesheet" href="/css/styles.css?v=2.5.0">
  <link rel="icon" href="/icons/proctorguard-logo.png">
  <script src="/socket.io/socket.io.js"></script>
</head>

<body class="pg-instructor">
  <!-- Passcode Overlay -->
  <div id="passcode-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-primary); z-index: 99999; justify-content: center; align-items: center; flex-direction: column;">
      <div class="card" style="padding: 40px; text-align: center; max-width: 420px; width: 90%; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
          <img src="/icons/proctorguard-logo.png" alt="ProctorGuard" style="width:56px; height:56px; object-fit:contain; margin-bottom:15px; border-radius:12px;" />
          <h2 style="margin-bottom: 10px; color: var(--text-primary); font-family: var(--font-sans); font-weight: 800; font-size: 24px; letter-spacing: -0.5px;">Instructor Secure Portal</h2>
          <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 25px; line-height: 1.5;">Please enter the passcode to access the proctoring dashboard.</p>
          <input type="password" id="passcode-input" placeholder="••••••" autocomplete="off" onkeydown="if (event.key === 'Enter') submitPasscode()" style="width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 20px; margin-bottom: 20px; box-sizing: border-box; text-align: center; letter-spacing: 6px; background: var(--bg-primary); color: var(--text-primary); outline: none; transition: var(--transition);" />
          <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 15px; font-weight: 700;" onclick="submitPasscode()">Verify & Enter</button>
          <div id="passcode-error-msg" class="badge badge-danger" style="margin-top: 15px; display: none; width: 100%; justify-content: center; font-size: 12px; font-weight: 700;"></div>
      </div>
  </div>

  <div class="app-container" id="app">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="logo">
        <img src="/icons/proctorguard-logo.png" alt="" class="logo-icon" style="width:36px; height:36px; object-fit:contain; border-radius:8px; background:transparent; box-shadow:none;" />
        <span>ProctorGuard<span class="pg-appbar-eyebrow">Review Console</span></span>
      </div>
      <div class="user-info">
        <span id="user-name">Instructor</span>
      </div>
    </div>

    <!-- Navigation Removed completely -->

    <!-- Main Content -->
    <div class="main-content" id="content">
      <div class="spinner" style="margin: 40px auto;"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

  <!-- Fullscreen Img View for Live -->
  <div class="modal-overlay" id="image-overlay" onclick="closeImage()">
      <img id="fullscreen-image" style="max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);" />
  </div>

  <script src="/js/app.js?v=2.5.0"></script>
</body>

</html>
