<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Proctor Gateway Teacher Dashboard">
  <title>Proctor Gateway</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/socket.io/socket.io.js"></script>
</head>

<body>
  <!-- Passcode Overlay -->
  <div id="passcode-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 99999; justify-content: center; align-items: center; flex-direction: column; font-family: sans-serif; color: white;">
      <div style="background: white; color: #1e293b; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%;">
          <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
          <h2 style="margin-bottom: 10px; color: #0f172a; font-weight: 700;">Secure Portal</h2>
          <p style="color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5;">Enter the instructor access code to enter the dashboard.</p>
          <input type="password" id="passcode-input" placeholder="Enter Passcode" style="width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 6px; font-size: 18px; margin-bottom: 20px; box-sizing: border-box; text-align: center; letter-spacing: 4px;" />
          <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 16px; font-weight: 600;" onclick="submitPasscode()">Verify & Access</button>
          <div id="passcode-error-msg" style="color: var(--danger); margin-top: 15px; display: none; font-size: 14px; font-weight: 600;"></div>
      </div>
  </div>

  <div class="app-container" id="app">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="logo">
        <div class="logo-icon">👁️</div>
        <span>Proctor Gateway</span>
      </div>
      <div class="user-info">
        <span id="user-name">Instructor</span>
      </div>
    </div>

    <!-- Navigation Removed completely -->

    <!-- Main Content -->
    <div class="main-content" id="content">
      <div class="spinner" style="margin: 40px auto;"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

  <!-- Fullscreen Img View for Live -->
  <div class="modal-overlay" id="image-overlay" onclick="closeImage()">
      <img id="fullscreen-image" style="max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);" />
  </div>

  <script src="/js/app.js"></script>
</body>

</html>
