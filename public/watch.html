<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProctorGuard — Session Playback</title>
    <link rel="stylesheet" href="/css/styles.css?v=2.1.0">
    <link rel="icon" href="/icons/proctorguard-logo.png">
    <style>
        body {
            padding: 32px 20px;
            text-align: center;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            font-family: var(--font-sans);
        }
        .vault-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .vault-header img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
        }
        video {
            max-width: 100%;
            width: 960px;
            height: auto;
            max-height: 70vh;
            border: 2px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
            margin-top: 16px;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        #status {
            margin: 12px 0 0;
            color: #94a3b8;
            font-family: var(--font-mono);
            font-size: 13px;
        }
        .hint {
            color: #64748b;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="vault-header">
        <img src="/icons/proctorguard-logo.png" alt="ProctorGuard" />
        <h1>Session Playback</h1>
    </div>
    <p id="status">Connecting…</p>
    <p class="hint">Prefer reviewing from the instructor dashboard report (timeline + seek). This page is a standalone player.</p>

    <video id="player" controls playsinline></video>

    <div class="controls">
        <button id="btn-download" class="btn btn-primary" style="display:none;">Download .webm</button>
        <button class="btn btn-secondary" onclick="window.close()">Close</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session');
        const video = document.getElementById('player');
        const status = document.getElementById('status');

        video.onerror = () => {
            const error = video.error;
            status.innerText = error
                ? `Playback error (${error.code}): ${error.message}. Download the file and open in VLC.`
                : 'Playback error. Try downloading the raw file.';
            status.style.color = '#ef4444';
        };

        async function loadVideo() {
            try {
                if (!sessionId) throw new Error('No session ID specified.');
                status.innerText = 'Loading stream…';

                const streamUrl = `/api/session/video-playback/${sessionId}`;
                video.src = streamUrl;

                const btnDownload = document.getElementById('btn-download');
                btnDownload.style.display = 'inline-flex';
                btnDownload.onclick = () => {
                    const a = document.createElement('a');
                    a.href = streamUrl;
                    a.download = `ProctorGuard_Session_${sessionId}.webm`;
                    a.click();
                };

                video.onloadedmetadata = () => {
                    if (video.duration === Infinity) {
                        status.innerText = 'Fixing WebM duration…';
                        video.currentTime = 1e101;
                        video.ontimeupdate = function () {
                            this.ontimeupdate = () => {};
                            video.currentTime = 0;
                            status.innerText = 'Ready for review.';
                        };
                    } else {
                        status.innerText = 'Ready for review.';
                    }
                };
            } catch (e) {
                status.innerText = 'Failed: ' + e.message;
                status.style.color = '#ef4444';
            }
        }

        loadVideo();
    </script>
</body>
</html>
