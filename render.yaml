services:
  - type: web
    name: canvas-proctor-gateway
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: LTI_KEY
        sync: false
      - key: LTI_SECRET
        sync: false
      # Must match the PG_SECRET constant hardcoded in extension/review-center.js —
      # don't let Render auto-generate this, it has to be set to the same value the
      # already-built extension package expects, or every extension API call breaks.
      - key: PG_SHARED_SECRET
        sync: false
