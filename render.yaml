services:
  - type: web
    name: canvas-proctor-gateway
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: LTI_KEY
        sync: false
      - key: LTI_SECRET
        sync: false
      # Signs the short-lived extension auth JWTs (see /api/extension/token in
      # server.js). Server-only — never shipped to the extension or dashboard.
      # Safe to auto-generate/rotate; rotating just forces existing extension
      # tokens to expire early (they're already ~20min TTL) and re-mint.
      - key: JWT_SIGNING_KEY
        generateValue: true
      # Unrelated legacy HMAC secret (auto-login link signing) — also server-only.
      - key: AUTO_LOGIN_SIGNING_SECRET
        generateValue: true
